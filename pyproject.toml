[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emalign-phonology"
version = "0.1.0"
description = "EM-based alignment of cognate sets in comparative dictionaries using articulatory features"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "Changeling Lab", email = "changeling@example.com"},
]
keywords = [
    "linguistics",
    "phonology",
    "alignment",
    "cognates",
    "historical-linguistics",
    "CLDF",
    "panphon",
    "expectation-maximization",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "numpy>=1.21.0",
    "panphon>=0.20.0",
    "pycldf>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/changelinglab/emalign"
Repository = "https://github.com/changelinglab/emalign"
Issues = "https://github.com/changelinglab/emalign/issues"

[project.scripts]
emalign = "emalign.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
